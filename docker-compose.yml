
services:
  frontend: 
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: minutebound-f-frontend
    env_file:
      - .env.frontend 
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - minutebound-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  minutebound-network:
    name: minutebound-network 
    driver: bridge

volumes:
  frontend_node_modules:
    driver: local